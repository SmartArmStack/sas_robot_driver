services:
  sas_robot_driver:
    build: .
    volumes:
      - ../../sas_robot_driver:/root/sas_robot_driver_devel/src/sas_robot_driver
    command: /bin/bash -c "
      cd /root/sas_robot_driver_devel/src/
      && ls .
      && colcon build
      && source install/setup.bash
      && ros2 run sas_robot_driver sas_robot_driver_interface_example.py"